name: Build Windows EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install customtkinter pyinstaller cryptography
      - name: Build EXE
        run: pyinstaller --onefile --windowed --name="RoyalVault" a.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RoyalVault-Windows-EXE
          path: dist/
